name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install clang-format 18.1.8
        run: pip install clang-format==18.1.8

      - name: Check C++ formatting
        run: |
          clang-format --version
          ./scripts/format_check.sh

  tidy-check:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 clang-tidy-18 cmake
          sudo ln -sf /usr/bin/clang-tidy-18 /usr/local/bin/clang-tidy

      - name: Configure
        run: cmake -B build -DPDX_COMPILE_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run clang-tidy
        run: |
          ln -s build/compile_commands.json compile_commands.json
          ./scripts/tidy_check.sh

  cpp-build-and-test:
    name: cpp-build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake

      - name: Configure
        run: cmake -B build -DPDX_COMPILE_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build -j$(nproc) --target tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  windows-msvc:
    name: windows-msvc (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
          - os: windows-11-arm
            arch: ARM64
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A ${{ matrix.arch }} -DPDX_COMPILE_TESTS=ON

      - name: Build tests
        run: cmake --build build --config Release --parallel --target tests

      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure

  macos-accelerate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DPDX_COMPILE_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build -j$(sysctl -n hw.ncpu) --target tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 3.1.71

      - name: Configure
        run: emcmake cmake -B build -DPDX_COMPILE_TESTS=ON -DPDX_SKIP_FFTW=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build tests
        run: cmake --build build -j$(nproc) --target tests

      - name: Run tests (Node)
        run: ctest --test-dir build --output-on-failure

  python:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python bindings
        run: pip install .

      - name: Verify import
        run: python -c "import pdxearch; print('pdxearch imported successfully')"

  sanitizers-asan-ubsan:
    name: sanitizers-asan-ubsan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake

      - name: Configure with ASan + UBSan
        run: |
          cmake -B build_asan -DPDX_COMPILE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_C_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -D_GLIBCXX_SANITIZE_VECTOR=1" \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build tests
        run: cmake --build build_asan -j$(nproc) --target tests

      - name: Run tests
        run: ctest --test-dir build_asan --output-on-failure

  sanitizers-tsan:
    name: sanitizers-tsan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CC: clang-18
      CXX: clang++-18
      TSAN_OPTIONS: ignore_noninstrumented_modules=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake

      - name: Configure with TSan
        run: |
          cmake -B build_tsan -DPDX_COMPILE_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_C_FLAGS_DEBUG="-g -O1" \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"

      - name: Build tests
        run: cmake --build build_tsan -j$(nproc) --target tests

      - name: Run tests
        run: ctest --test-dir build_tsan --output-on-failure

  ci-pass:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - format-check
      - tidy-check
      - cpp-build-and-test
      - windows-msvc
      - macos-accelerate
      - wasm
      - python
      - sanitizers-asan-ubsan
      - sanitizers-tsan
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          fi
